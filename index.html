<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
._EpWCxHNd{background:white;padding:50px 40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.1);text-align:center;max-width:600px;width:100%;animation:fadeInUp 0.8s ease}
.error-icon{font-size:72px;margin-bottom:20px;display:block;animation:shake 1s ease 3}
.error-title{font-size:28px;font-weight:700;color:#e74c3c;margin-bottom:12px}
.error-message{font-size:16px;color:#666;margin-bottom:25px;line-height:1.6}
.error-links{list-style:none;padding:0;margin:20px 0 30px;text-align:center}
.error-links li{margin-bottom:10px;font-size:15px;color:#555}
.error-links a{display:inline-block;background:#3498db;color:white;padding:12px 28px;border-radius:50px;text-decoration:none;font-weight:600;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(52,152,219,0.3)}
.error-links a:hover{background:#2980b9;transform:translateY(-2px);box-shadow:0 8px 25px rgba(52,152,219,0.4)}
.dev{margin-top:30px;padding-top:20px;border-top:2px solid #f0f0f0;font-size:14px;color:#888}
.dev a{color:#3498db;text-decoration:none;font-weight:600;transition:color 0.3s ease}
.dev a:hover{color:#2980b9;text-decoration:underline}
#decrypt-status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555;background:rgba(255,255,255,0.9);padding:30px 40px;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.15)}
#decrypt-status .spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #3498db;border-radius:50%;animation:spin 1s linear infinite;margin-left:15px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@media(max-width:480px){._DFyYBxkA{padding:30px 20px}.error-icon{font-size:56px}.error-title{font-size:22px}.error-links a{padding:10px 20px;font-size:14px}}
</style>
